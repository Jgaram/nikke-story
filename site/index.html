<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIKKE 스토리 지도</title>
  <meta name="description" content="NIKKE 스토리 간 연관관계 분석 · 시각화 — 비공식 · 개인 분석 · 대사 본문 없음">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%232a78d6%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23fcfcfb%27/%3E%3C/svg%3E">
  <script>
    // 테마를 그리기 전에 적용한다(깜빡임 방지). 저장값이 없으면 OS 설정.
    try { var t = localStorage.getItem('nikke-story.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./tabs/order.css">
  <link rel="stylesheet" href="./tabs/links.css">
  <link rel="stylesheet" href="./tabs/threads.css">
  <link rel="stylesheet" href="./tabs/persons.css">
  <link rel="stylesheet" href="./tabs/chrono.css">
  <link rel="stylesheet" href="./tabs/world.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="brand">
      <a class="brand-name" href="#tab=order">NIKKE 스토리 지도</a>
      <span class="brand-sub">비공식 · 개인 분석 · 대사 본문 없음</span>
    </div>
    <div class="search" role="search">
      <label class="sr-only" for="search">검색 — 인물 · 대상 · 줄기 · 단위 · 기록 문장</label>
      <input id="search" type="search" placeholder="검색: 인물 · 대상 · 줄기 · 단위 · 기록 문장 (/)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div id="cutoff" class="ctl cutoff"></div>
    <div id="layers" class="ctl layers" role="group" aria-label="층 거르개"></div>
    <button id="theme-btn" type="button" class="btn theme-btn" aria-label="테마 바꾸기">◐ 자동</button>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="탭"></nav>
  <div class="layout">
    <main id="main" class="main" role="tabpanel" tabindex="-1"></main>
    <aside id="reader" class="reader" hidden></aside>
  </div>
  <footer class="foot">
    <p id="d3-notice" class="notice notice-warn" hidden>d3(CDN)를 불러오지 못했다 — 그래프 · 타임라인 탭이 안 그려질 수 있다.</p>
    <p id="data-basis">데이터 기준: 불러오는 중…</p>
    <p>출처: 게임 안 스토리(블라링크 공개 CDN)와 팬 사이트 금서고의 원문을 읽고 남긴 기록 · 공식 공지의 공개 순서. 모든 숫자 · 등급은 기록 ID → 씬 ID#줄로 내려간다.</p>
    <p>게임 저작권은 SHIFT UP · 이 사이트는 비공식 개인 분석으로 대사 원문을 싣지 않습니다.</p>
  </footer>
</body>
</html>
